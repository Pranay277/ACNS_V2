# SCIARS CI (P2-05 / P2-11).
#
# Runs on every push / PR against main:
#   * Backend  — exact-pin install, pytest regression suite, pip-audit (known
#                vulnerable dependencies).
#   * Frontend — install, production build, npm audit (only `--omit=dev` so
#                build-time dev deps are excluded from the gate).
#
# The auth/API-contract tests skip automatically when no
# backend/serviceAccountKey.json is present (it is gitignored by design); the
# pure-logic tests always run. Supply a repository secret for a real service
# account to exercise the full suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ACNS_v2/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ACNS_v2/backend/requirements.txt

      - name: Install exact-pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit pytest

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --no-deps -r requirements.txt

  frontend:
    name: Frontend (build + npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ACNS_v2/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ACNS_v2/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
