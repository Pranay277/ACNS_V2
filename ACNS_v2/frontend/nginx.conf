# SCIARS frontend Nginx config (P2-11).
#
# Serves the static SPA build and reverse-proxies /api/* to the backend
# service. `try_files ... /index.html` keeps react-router BrowserRouter URLs
# working on refresh. Terminate TLS on a reverse proxy in front of this (see
# DEPLOYMENT.md) so plaintext HTTP never leaves the host.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sensible static file caching.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy — same-origin so the browser uses the frontend origin for /api.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
